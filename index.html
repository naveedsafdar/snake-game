<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A classic Snake game with a live leaderboard.">
  <title>Snake</title>

  <!-- All styling lives in the CSS file -->
  <link rel="stylesheet" href="css/style.css?v=11">
</head>
<body>
  <main class="game">

    <!-- Title, current player and live score -->
    <header class="game-header">
      <h1 class="game-title">Snake</h1>
      <div class="header-info">
        <span class="player-label hidden" id="player-label">👤 <span id="player-name"></span></span>
        <span class="score">Score: <span id="score">0</span></span>
      </div>
    </header>

    <!-- The board: the canvas the game is drawn on, plus screens on top of it -->
    <div class="board" id="board">
      <canvas id="canvas" width="400" height="400"></canvas>

      <!-- Home screen: name entry, leaderboard and stats -->
      <div class="overlay overlay-home" id="home-screen">
        <form class="name-form" id="name-form" autocomplete="off">
          <label for="name-input">Enter your name to play</label>
          <div class="name-row">
            <input id="name-input" type="text" maxlength="20" placeholder="Your name">
            <button type="submit" id="play-button">Play</button>
          </div>
          <p class="form-message" id="form-message"></p>
        </form>

        <!-- Leaderboard: top 3 on a podium with dancing snakes, then every
             other player in a list that scrolls (filled in by game.js) -->
        <section class="leaderboard" aria-label="Leaderboard">
          <div class="podium hidden" id="podium"></div>
          <div class="ranking" id="ranking"></div>
        </section>

        <p class="stats" id="stats"></p>
      </div>

      <!-- Shown before the first move -->
      <div class="overlay overlay-start hidden" id="start-screen">
        <p id="start-hint">Press an arrow key to start</p>
      </div>

      <!-- Shown after a crash -->
      <div class="overlay overlay-game-over hidden" id="game-over-screen">
        <h2>Game Over</h2>
        <p class="final-score">Score: <span id="final-score">0</span></p>
        <p class="save-status" id="save-status"></p>
        <p class="restart" id="restart-hint">Press space to play again</p>
        <button type="button" class="link-button" id="home-button">Back to home</button>
      </div>
    </div>

    <footer class="game-help">
      <p class="game-rules">🍎 Healthy +2 · 🍔 Junk +1 · 🌵 Cactus −5 and shrinks you · 💊 Pill shrinks you</p>
      <p id="help-text">Use the arrow keys to move</p>
    </footer>
  </main>

  <!-- Supabase library (talks to the database) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

  <!-- Our scripts: settings, database helpers, then the game.
       Bump ?v= on all files after each change so browsers load the new versions. -->
  <script src="js/config.js?v=11"></script>
  <script src="js/db.js?v=11"></script>
  <script src="js/game.js?v=11"></script>
</body>
</html>
